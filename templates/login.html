<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot_name }} — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1e2a3a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; border-radius: 16px; padding: 40px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-card h4 { font-weight: 700; color: #1e2a3a; margin-bottom: 4px; }
        .login-card .subtitle { color: #718096; font-size: 14px; margin-bottom: 28px; }
        .form-control { border-radius: 8px; padding: 10px 14px; border-color: #e2e8f0; }
        .form-control:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49,130,206,0.15); }
        .btn-primary { background: #3182ce; border: none; border-radius: 8px; padding: 10px; font-weight: 600; }
        .btn-primary:hover { background: #2b6cb0; }
        label { font-size: 13px; font-weight: 600; color: #4a5568; }
    </style>
</head>
<body>
<div class="login-card">
    <h4>🤖 {{ bot_name }}</h4>
    <div class="subtitle">Панель администратора</div>
    {% if error %}
    <div class="alert alert-danger py-2 px-3" style="font-size:14px; border-radius:8px;">{{ error }}</div>
    {% endif %}
    <form method="post">
        <div class="mb-3">
            <label>Логин</label>
            <input type="text" name="login" class="form-control mt-1" autofocus>
        </div>
        <div class="mb-4">
            <label>Пароль</label>
            <input type="password" name="password" class="form-control mt-1">
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
</div>
</body>
</html>
